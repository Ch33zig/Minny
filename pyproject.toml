[project]
name = "minny"
version = "0.1.0"
description = "Insider-threat forensics, streaming detection, and adversarial evaluation over web access logs"
requires-python = ">=3.10"

# Append one line at the end of this list. Never reorder: reordering is the
# only thing in this file that can cause a merge conflict between tracks.
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
    "pyyaml>=6.0",
    "anthropic>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The live integration path only. Without it every capability runs on the
# recorded responses in fixtures/integrations/, which is the default.
integrations = ["composio>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
