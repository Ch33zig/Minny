<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4A3B2C" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Insider-threat case file and live monitor over web server logs." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%234A3B2C'/%3E%3Cpath fill='%23C9A87C' d='M8 18h18l5 6h25v30H8z'/%3E%3Cpath fill='%23F2E8D5' d='M12 26h44v24H12z'/%3E%3Ccircle cx='44' cy='38' r='9' fill='none' stroke='%23B4342A' stroke-width='3'/%3E%3C/svg%3E" />
    <title>Minny · Case file</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="board">
      <header class="jacket">
        <div class="jacket-id">
          <div class="case-no" id="caseId">MINNY</div>
          <div class="jacket-label">
            <h1 class="case-name" id="caseTitle">Loading case file…</h1>
            <p class="jacket-sub">
              <span class="view-title" id="viewTitle">Case file</span>
              <span class="jacket-window" id="windowChip" hidden><span class="none">&#183;</span></span>
            </p>
          </div>
        </div>

        <div class="jacket-slips">
          <!-- Pinned status slips live here. A strip added by another track is
               restyled into this row as a `.slip`, no layout change needed. -->
          <div class="slip source-slip">
            <span class="slip-head">EXHIBIT SOURCE</span>
            <b class="slip-line" id="srcLines"><span class="none">&#183;</span></b>
            <b class="slip-line dim" id="srcHash"><span class="none">&#183;</span></b>
          </div>
          <div class="slip mode-slip" id="modeChip"><span class="none">&#183;</span></div>
          <div class="slip-row" id="statusSlips"></div>
        </div>
      </header>

      <nav id="nav" aria-label="Primary navigation">
        <a class="tab" href="#case" data-view="case"><span>Case file</span><kbd>1</kbd></a>
        <a class="tab" href="#monitor" data-view="monitor"><span>Monitor</span><kbd>2</kbd></a>
        <a class="tab" href="#judge" data-view="judge"><span>Judge</span><kbd>3</kbd></a>
        <a class="tab" href="#metrics" data-view="metrics"><span>Metrics</span><kbd>4</kbd></a>
        <a class="tab" href="#blue" data-view="blue"><span>Blue agent</span><kbd>5</kbd></a>
      </nav>

      <main class="surface">
        <section class="view" id="view-case" hidden></section>
        <section class="view" id="view-monitor" hidden></section>
        <section class="view" id="view-judge" hidden></section>
        <section class="view" id="view-metrics" hidden></section>
        <section class="view" id="view-blue" hidden></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
